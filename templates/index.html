<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MICF Insights</title>
  <link rel="icon" href="https://www.comedyfestival.com.au/favicon.ico">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="density-compact">

  <!-- Header -->
  <header class="header">
    <a href="/" class="logo">
      <img src="https://www.comedyfestival.com.au/images/micf-logo.svg" alt="MICF" onerror="this.style.display='none'">
      <span>Insights</span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search shows, artists, venues...">
      <button id="search-clear" class="search-clear hidden">&times;</button>
    </div>

    <div class="spacer"></div>

    <!-- Location -->
    <button id="location-btn" class="toolbar-btn">Enable Location</button>
    <button id="unit-btn" class="unit-btn hidden">km</button>

    <!-- Calendar -->
    <div class="dropdown-wrap">
      <button id="date-btn" class="toolbar-btn">Dates</button>
      <div id="calendar-panel" class="dropdown-panel calendar-panel">
        <div id="calendar-content"></div>
      </div>
    </div>

    <!-- Column chooser -->
    <div class="dropdown-wrap">
      <button id="colchooser-btn" class="toolbar-btn">Columns</button>
      <div id="colchooser-panel" class="dropdown-panel colchooser-panel">
        <div class="dropdown-header">
          <span>Show/Hide Columns</span>
          <button id="colchooser-reset">Reset</button>
        </div>
        <div id="colchooser-list"></div>
      </div>
    </div>

    <!-- Export -->
    <div class="dropdown-wrap">
      <button id="export-btn" class="toolbar-btn">Export</button>
      <div id="export-panel" class="dropdown-panel export-panel">
        <div class="dropdown-header"><span>Export Data</span></div>
        <a href="/export/json" download class="export-item">
          <span class="export-icon">{}</span>
          <div><div class="export-label">JSON</div><div class="export-desc">Structured data, all tables</div></div>
        </a>
        <a href="/export/csv" download class="export-item">
          <span class="export-icon">csv</span>
          <div><div class="export-label">CSV (ZIP)</div><div class="export-desc">3 CSV files in a ZIP archive</div></div>
        </a>
        <a href="/export/excel" download class="export-item">
          <span class="export-icon green">xl</span>
          <div><div class="export-label">Excel (.xlsx)</div><div class="export-desc">Spreadsheet with 3 sheets</div></div>
        </a>
        <a href="/export/db" download class="export-item">
          <span class="export-icon">db</span>
          <div><div class="export-label">SQLite Database</div><div class="export-desc">Raw database file</div></div>
        </a>
      </div>
    </div>

    <!-- Density -->
    <button id="density-btn" class="toolbar-btn">Comfortable</button>
  </header>

  <!-- Table -->
  <main id="main-scroll" class="main">
    <table id="data-table" class="data-table">
      <colgroup id="colgroup"></colgroup>
      <thead>
        <tr id="header-row"></tr>
        <tr id="filter-row" class="filter-row"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <span id="footer-count" class="footer-count"></span>
    <span id="footer-total" class="footer-total" style="display:none"></span>
    <div id="footer-pills" class="footer-pills"></div>
    <span class="footer-hint">Press <kbd>/</kbd> to search</span>
  </footer>

  <!-- Embedded show data from server -->
  <script>
    window.__DATA__ = {
      shows: {{.Shows}},
      totalShows: {{.TotalShows}},
      search: "{{.Search}}",
      suburbs: {{.Suburbs}},
      regions: {{.Regions}}
    };
  </script>
  <script src="/static/app.js"></script>
</body>
</html>
